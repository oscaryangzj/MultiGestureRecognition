data:
  sessions_dir: data/sessions
  splits_file: models/action/splits.json
  camera_index: 0
  fps_target: 30
  action_window_seconds: 8.0
  action_sample_rate_hz: 30.0
  action_stride_frames: 5
  action_background_visible_frames: 3
  no_hand_reset_frames: 3
hand_landmarker:
  model_asset_path: models/hand_landmarker.task
  delegate: CPU
  num_hands: 1
  min_hand_detection_confidence: 0.5
  min_hand_presence_confidence: 0.5
  min_tracking_confidence: 0.5
gesture_recognizer:
  model_asset_path: models/gesture_recognizer.task
  category_names:
    closed: Closed_Fist
    opened: Open_Palm
    thumb_up: Thumb_Up
labels:
  state_classes:
  - closed
  - opened
  - thumb_up
  action_classes:
  - open_hand
  - close_hand
  - left_to_right
  - right_to_left
  action_positive_frames: 4
  action_one_shot_direction_background: true
display:
  mirror_preview: true
  action_show_debug: false
  text_font_path: /System/Library/Fonts/STHeiti Medium.ttc
  annotation_max_width: 960
  annotation_max_height: 540
  prompt_colors:
    REST:
    - 60
    - 155
    - 230
    HOLD:
    - 60
    - 155
    - 230
    PREPARE:
    - 90
    - 90
    - 90
    NEGATIVE:
    - 150
    - 100
    - 55
    closed:
    - 210
    - 115
    - 70
    opened:
    - 85
    - 165
    - 65
    thumb_up:
    - 175
    - 95
    - 145
    open_hand:
    - 85
    - 165
    - 65
    close_hand:
    - 210
    - 115
    - 70
    waving:
    - 165
    - 115
    - 55
    left_to_right:
    - 80
    - 190
    - 235
    right_to_left:
    - 210
    - 155
    - 85
features:
  local_scale: wrist_to_middle_mcp
  action_include_acceleration: true
  action_include_finger_angles: true
  action_finger_angle_triples:
  - - 5
    - 6
    - 7
  - - 9
    - 10
    - 11
  - - 13
    - 14
    - 15
  - - 17
    - 18
    - 19
  - - 1
    - 2
    - 3
  action_align_palm_axis: true
  action_canonicalize_hand: true
  action_wrist_feature: angular_velocity
  min_hand_scale: 1.0e-06
  palm_landmark_indices:
  - 0
  - 5
  - 9
  - 13
  - 17
  action_state_classes:
  - opened
  - closed
  normalization_min_std: 1.0e-06
models:
  state_hidden_size: 128
  action_hidden_size: 128
  action_num_layers: 3
  action_conv_channels: 128
  action_conv_kernel_size: 3
  action_dropout: 0.1
inference:
  state_threshold: 0.5
  recordings_dir: runs/state/recordings
  action_threshold: 0.5
  action_reset_threshold: 0.5
  action_thresholds:
    open_hand: 0.5
    close_hand: 0.5
    left_to_right: 0.5
    right_to_left: 0.5
  action_reset_thresholds:
    open_hand: 0.5
    close_hand: 0.5
    left_to_right: 0.5
    right_to_left: 0.5
  action_debounce_seconds: 0.05
  action_debounce_by_group:
    one_shot: 0.05
    direction: 0.05
  action_event_groups:
    one_shot:
    - open_hand
    - close_hand
    direction:
    - left_to_right
    - right_to_left
  action_model_mode: combined
  action_device: cpu
  action_cpu_threads: 2
  action_opencv_threads: 1
  action_camera_fps: 30
  action_input_max_width: 640
  action_output_hold_seconds: 0.4
  action_output_dir: runs/action
  action_one_shot_output_dir: runs/action_one_shot
  action_finger_angles_output_dir: runs/action_finger_angles
  action_combined_output_dir: runs/action_reproduced
  waving_pair_timeout_seconds: 0.3
  waving_active_timeout_seconds: 0.3
evaluation:
  action_match_tolerance_seconds: 0.5
  waving_start_match_tolerance_seconds: 1.5
  action_acceptance_split: acceptance
annotation:
  action_state_threshold: 0.5
  action_stable_frames: 3
  action_lookback_frames: 15
  action_motion_threshold: 0.04
  action_motion_confirm_frames: 2
  periodic:
    fingertip_indices:
    - 4
    - 8
    - 12
    - 16
    - 20
    smooth_frames: 3
    max_axis_angle_degrees: 45
    min_leg_scale: 0.3
    reverse_scale: 0.05
    reverse_confirm_frames: 2
training:
  device: mps
  seed: 42
  batch_size: 64
  learning_rate: 0.001
  max_epochs: 30
  action_batch_size: 32
  action_cpu_threads: 4
  action_mirror_probability: 0.5
  action_max_positive_weight: 20.0
  action_gradient_clip: 5.0
  action_warmup_epochs: 5
  action_warmup_start_factor: 0.001
  action_lr_decay_every_epochs: 25
  action_lr_decay_factor: 0.5
